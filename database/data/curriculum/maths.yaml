# Référentiel de mathématiques, du CP à la 3e — version 1.
# Rédigé d'après les programmes officiels des cycles 2, 3 et 4 : À VALIDER PAR L'ÉQUIPE PÉDAGOGIQUE.
#
# Un domaine regroupe des compétences ; chaque compétence a un code stable (MATIÈRE.NIVEAU.DOMAINE.CLÉ),
# un libellé et ses niveaux (« ce2 » ou « ce1-ce2 »). Ne jamais réutiliser un code pour une autre
# compétence : retirée du fichier, une compétence reste en base, marquée retirée.
# Après modification : php artisan curriculum:sync

subject:
  key: maths
  color: maths
  icon: calculator
  position: 1

